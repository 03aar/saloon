name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx oxlint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # Note: the Playwright route-sweep (`npm run sweep`) is a local/manual visual regression
      # check — it needs a running preview server and a sandbox-specific browser binary path,
      # so it's intentionally not run in this generic CI environment.
